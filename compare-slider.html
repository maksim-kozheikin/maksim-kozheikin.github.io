<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Сравнение качества: слайдер</title>
<style>
:root{--bg:#1b1b1f;--bar:#26262b;--ink:#f2f2f4;--muted:#9a9aa3;--line:#3a3a41;--accent:#F0512F}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{height:52px;display:flex;align-items:center;gap:10px 16px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.grp{display:flex;gap:4px;align-items:center}
.grp>span{color:var(--muted);margin-right:4px}
button{font:inherit;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:hover{border-color:#66666f}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{margin-left:auto;color:var(--muted)}
#stage{position:absolute;left:0;right:0;top:52px;bottom:0;overflow:hidden;background:#101013;cursor:grab;touch-action:none;user-select:none}
#stage.drag{cursor:grabbing}
.layer{position:absolute;inset:0;overflow:hidden}
.layer img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;image-rendering:auto;will-change:transform}
#newLayer{clip-path:inset(0 0 0 var(--x,50%))}
#divider{position:absolute;top:0;bottom:0;left:var(--x,50%);width:44px;margin-left:-22px;cursor:ew-resize;z-index:5;touch-action:none}
#divider:before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#divider i{position:absolute;left:4px;top:50%;width:36px;height:36px;margin-top:-18px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.tag{position:absolute;top:10px;z-index:4;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;pointer-events:none;max-width:46%}
.tag b{font-weight:600}
.tag small{display:block;color:#c8c8cf;font-size:12px}
#tagL{left:10px}
#tagR{right:10px;text-align:right}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(0,0,0,.75);padding:10px 16px;border-radius:12px;display:none}
@media (max-width:700px){.hint{display:none}}
</style>
</head>
<body>
<div class="bar">
  <div class="grp" id="pick"><span>Картинка</span></div>
  <div class="grp" id="zoom">
    <span>Масштаб</span>
    <button data-z="fit">Вписать</button><button data-z="width">По ширине</button><button data-z="1">100%</button><button data-z="2">200%</button>
    <button data-step="-1" aria-label="Уменьшить">−</button><button data-step="1" aria-label="Увеличить">+</button>
  </div>
  <div class="hint">Тяните линию, чтобы сравнить. Колесо или тач-панель двигает картинку, Ctrl+колесо или щипок — масштаб, двойной клик — 100%.</div>
</div>

<div id="stage">
  <div class="layer" id="oldLayer"><img id="oldImg" alt="Сейчас" draggable="false"></div>
  <div class="layer" id="newLayer"><img id="newImg" alt="Новое" draggable="false"></div>
  <div class="tag" id="tagL"></div>
  <div class="tag" id="tagR"></div>
  <div id="divider"><i>⇆</i></div>
  <div id="loading">Загружаю картинки…</div>
</div>

<script>
/* три самые тяжёлые картинки: слева текущая версия, справа новая (русская версия страницы) */
const SETS = [
  { name: "Каталог (длинная)", w: 4156, h: 10730,
    a: { src: "assets/sber-catalog/ru-sber-catalog 6.png", fmt: "PNG",  mb: "4,26 МБ" },
    b: { src: "assets/sber-new/sber-catalog-6-ru.webp",   fmt: "webp", mb: "1,79 МБ" } },
  { name: "Лендинг",           w: 4896, h: 2984,
    a: { src: "assets/sber-landing/ru-sber-landing 4.png", fmt: "PNG",  mb: "3,07 МБ" },
    b: { src: "assets/sber-new/sber-landing-4-ru.webp",    fmt: "webp", mb: "0,41 МБ" } },
  { name: "Экран заказа",      w: 9831, h: 3859,
    a: { src: "assets/sber-orders/ru-sber-orders 2.png",   fmt: "PNG",  mb: "2,76 МБ" },
    b: { src: "assets/sber-new/sber-orders-2-ru.webp",     fmt: "webp", mb: "1,47 МБ" } }
];

const $ = id => document.getElementById(id);
const stage = $("stage"), oldImg = $("oldImg"), newImg = $("newImg"), loading = $("loading");
let cur = 0, k = 1, x = 0, y = 0, divX = 0.5;       // divX — доля ширины окна

/* ---------- выбор картинки ---------- */
SETS.forEach((s, i) => {
  const b = document.createElement("button");
  b.textContent = (i + 1) + ". " + s.name; b.dataset.i = i;
  b.onclick = () => select(i);
  $("pick").appendChild(b);
});
function select(i) {
  cur = i; const s = SETS[i];
  document.querySelectorAll("#pick button").forEach(b => b.classList.toggle("on", +b.dataset.i === i));
  $("tagL").innerHTML = "<b>Сейчас</b><small>" + s.a.fmt + " · " + s.a.mb + "</small>";
  $("tagR").innerHTML = "<b>Новое</b><small>" + s.b.fmt + " · " + s.b.mb + "</small>";
  let n = 0; loading.style.display = "block";
  const done = () => { if (++n === 2) { loading.style.display = "none"; fit("fit"); } };
  oldImg.onload = newImg.onload = done;
  oldImg.style.width = newImg.style.width = s.w + "px";
  oldImg.style.height = newImg.style.height = s.h + "px";
  oldImg.src = s.a.src; newImg.src = s.b.src;
}

/* ---------- положение и масштаб (общие для обеих картинок) ---------- */
function apply() {
  const t = "translate(" + x + "px," + y + "px) scale(" + k + ")";
  oldImg.style.transform = newImg.style.transform = t;
}
function setDiv(v) {
  divX = Math.max(0, Math.min(1, v));
  stage.style.setProperty("--x", (divX * 100) + "%");
  $("divider").style.setProperty("--x", (divX * 100) + "%");
}
function clampPan() {
  const s = SETS[cur], W = stage.clientWidth, H = stage.clientHeight, cw = s.w * k, ch = s.h * k;
  x = cw <= W ? (W - cw) / 2 : Math.min(0, Math.max(W - cw, x));
  y = ch <= H ? (H - ch) / 2 : Math.min(0, Math.max(H - ch, y));
}
function fit(mode) {
  const s = SETS[cur], W = stage.clientWidth, H = stage.clientHeight;
  if (mode === "fit") k = Math.min(W / s.w, H / s.h);
  else if (mode === "width") k = W / s.w;
  else k = +mode;
  x = (W - s.w * k) / 2; y = mode === "width" ? 0 : (H - s.h * k) / 2;
  clampPan(); apply(); markZoom(mode);
}
function markZoom(m) { document.querySelectorAll("#zoom [data-z]").forEach(b => b.classList.toggle("on", b.dataset.z === String(m))); }
function zoomAt(nk, cx, cy) {
  const W = stage.clientWidth, s = SETS[cur];
  const min = Math.min(W / s.w, stage.clientHeight / s.h) * 0.6;
  nk = Math.max(min, Math.min(8, nk));
  x = cx - (cx - x) * nk / k; y = cy - (cy - y) * nk / k; k = nk;
  clampPan(); apply(); markZoom("");
}
document.querySelectorAll("#zoom [data-z]").forEach(b => b.onclick = () => fit(b.dataset.z));
document.querySelectorAll("#zoom [data-step]").forEach(b => b.onclick = () =>
  zoomAt(k * (b.dataset.step > 0 ? 1.4 : 1 / 1.4), stage.clientWidth / 2, stage.clientHeight / 2));

/* ---------- мышь, тач, щипок ---------- */
const ptrs = new Map(); let pan = null, pinch = null, dragDiv = false;
stage.addEventListener("pointerdown", e => {
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (e.target.closest("#divider")) { dragDiv = true; return; }
  if (ptrs.size === 1) { pan = { x: e.clientX, y: e.clientY, ox: x, oy: y }; stage.classList.add("drag"); }
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k }; pan = null;
  }
});
stage.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = stage.getBoundingClientRect();
  if (dragDiv) { setDiv((e.clientX - r.left) / r.width); return; }
  if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()];
    zoomAt(pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
  } else if (pan) {
    x = pan.ox + (e.clientX - pan.x); y = pan.oy + (e.clientY - pan.y); clampPan(); apply(); markZoom("");
  }
});
function up(e) {
  ptrs.delete(e.pointerId); if (!ptrs.size) { pan = null; pinch = null; dragDiv = false; stage.classList.remove("drag"); }
  if (ptrs.size === 1) { const p = [...ptrs.values()][0]; pan = { x: p.x, y: p.y, ox: x, oy: y }; pinch = null; }
}
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);

stage.addEventListener("wheel", e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(k * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { x -= e.deltaX; y -= e.deltaY; clampPan(); apply(); markZoom(""); }
}, { passive: false });
stage.addEventListener("dblclick", e => {
  if (e.target.closest("#divider")) return;
  const r = stage.getBoundingClientRect();
  if (Math.abs(k - 1) < 0.01) fit("fit"); else zoomAt(1, e.clientX - r.left, e.clientY - r.top);
});

/* ---------- клавиши ---------- */
addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= String(SETS.length)) select(+e.key - 1);
  else if (e.key === "ArrowLeft") setDiv(divX - 0.02);
  else if (e.key === "ArrowRight") setDiv(divX + 0.02);
  else if (e.key === "+" || e.key === "=") zoomAt(k * 1.4, stage.clientWidth / 2, stage.clientHeight / 2);
  else if (e.key === "-") zoomAt(k / 1.4, stage.clientWidth / 2, stage.clientHeight / 2);
  else if (e.key === "0") fit("fit");
});
addEventListener("resize", () => { clampPan(); apply(); });
setDiv(0.5); select(0);
</script>
</body>
</html>
