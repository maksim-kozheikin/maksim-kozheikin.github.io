<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Максим Кожейкин</title>
<meta name="description" content="Максим Кожейкин — продуктовый дизайнер. Таймлайн: работа, проекты, обучение, творчество.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

::view-transition-old(main-col){animation:fOut .16s ease both}
::view-transition-new(main-col){animation:fIn .22s ease both}
@keyframes fOut{to{opacity:0;transform:translateY(-4px)}}
@keyframes fIn{from{opacity:0;transform:translateY(6px)}}

:root{
  --bg:#FCFCFD; --surface:#FFFFFF; --ink:#131316; --muted:#6C6C74; --faint:#9A9AA2;
  --line:#EBEBEF; --panel:#F4F4F7; --accent:#F0523C; --sel:#F1F1F4;
  /* ТИПОГРАФИЧЕСКАЯ ШКАЛА — 5 ступеней, других размеров в проекте нет
     --h1  Заголовок раздела:  «Кабинет врача», «Приложение SmartMed»
     --h2  Заголовок кейса:    «Расписание», «Главный экран»
           Заголовок страницы: «Lead UX/UI Designer · Medsi Digital»
     --h3  Подзаголовок:       «Проблемы», «Результат»
     --text  Основной текст:   пункты списков, описания, обязанности
     --small Вторичный текст:  чипы, подписи, навигация, мета
     --eyebrow Надзаголовок:   «КЕЙС 05», рубрики, метки  */
  --h1:clamp(2rem,3.4vw,2.9rem);
  --h2:clamp(1.6rem,2.2vw,2rem);
  --h3:1.02rem;
  --text:.98rem;
  --small:.88rem;
  --eyebrow:.72rem;
  --sans:"Golos Text",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --sidebar-w:clamp(300px,40vw,560px);
  --pad:clamp(20px,3vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

/* ============================================================
   КОМПОНЕНТЫ — переиспользуются везде. Новых не заводим.
   .row   — строка списка (проекты, образование, портфолио)
   .card  — карточка (проблемы, решения, цели, результаты)
   .shot  — плейсхолдер изображения
   .chip  — тег
============================================================ */
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:baseline;padding:11px 2px;border-top:1px solid var(--line);
  transition:padding-left .18s,color .18s}
.list > .row:last-child,.list > a.row:last-of-type{border-bottom:1px solid var(--line)}
a.row:hover{padding-left:7px}
a.row:hover .row-ti{color:var(--accent)}
.row-yr{flex:0 0 82px;font-size:var(--small);color:var(--faint);font-variant-numeric:tabular-nums}
.row-ti{font-size:var(--text);line-height:1.4}
.row-arr{margin-left:auto;color:var(--faint);font-size:var(--text);line-height:1;align-self:center;transition:transform .2s,color .2s}
a.row:hover .row-arr{transform:translateX(3px)}
a.row[aria-current="page"] .row-arr{transform:rotate(90deg)}
a.row[aria-current="page"] .row-ti{color:var(--accent);font-weight:600}
a.row[aria-current="page"] .row-arr{color:var(--accent)}

.subnav{display:flex;flex-direction:column;padding:4px 0 10px 94px;gap:2px}
.subnav a{color:var(--muted);font-size:var(--small);transition:color .15s,padding-left .15s}
.subnav a:hover{color:var(--accent);padding-left:4px}
.subnav a.active{color:var(--accent);font-weight:600}

/* разделы — тихие рубрики (eyebrow, уже есть в системе), кейсы — основной текст */
.subnav a.grp{color:var(--muted);font-size:var(--small)}
.subnav a.grp:hover{color:var(--accent)}
.subnav a.cs{display:flex;gap:8px;align-items:baseline;color:var(--faint);font-size:var(--small)}
.subnav a.cs:hover{color:var(--accent)}
.subnav a.cs .n{flex:0 0 16px;color:inherit;font-variant-numeric:tabular-nums;font-size:var(--small)}
.subnav a.active{color:var(--accent)}


.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{font-weight:600;font-size:var(--h3);margin-bottom:9px}
.card p{color:var(--muted);font-size:var(--text)}
/* метрика — только цифра и подпись, разделение воздухом */
.card.metric{background:none;border:none;border-radius:0;padding:0;text-align:left}
.cols:has(.card.metric){grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px 40px;margin-top:20px}
.card.metric .num{display:inline;font-weight:600;font-size:var(--text);color:var(--ink)}
.card.metric .lbl{display:inline;color:var(--ink);font-size:var(--text);font-weight:600;line-height:1.5}
.card.metric .desc{display:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:20px}
/* пункты внутри кейса */
.points{list-style:none;display:flex;flex-direction:column;gap:11px;margin-top:16px;max-width:64ch}
.points li{position:relative;padding-left:20px;color:var(--ink);font-size:var(--text)}
.points li::before{content:"✦";position:absolute;left:0;top:0;color:var(--accent);font-size:.85rem;line-height:1;display:flex;align-items:center;height:calc(var(--text) * 1.6)}
.points li b{color:var(--ink);font-weight:600}

.shot{border:1px solid var(--line);border-radius:14px;aspect-ratio:16/9;background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:var(--small);text-align:center;padding:20px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.caption{color:var(--muted);font-size:var(--small);margin-top:10px}

/* изображения в ряд: одинаковая высота, ширина по пропорции, без обрезки */
.figs{display:flex;flex-wrap:wrap;gap:16px;margin-top:24px;align-items:flex-start}
.fig{margin:0;min-width:0;flex:1 1 0}
.fig-btn{display:block;width:100%;padding:0;background:none;cursor:zoom-in;
  transition:transform .25s ease}
.fig-btn:hover{transform:translateY(-3px)}
.fig-btn img{width:100%;height:auto;display:block;filter:drop-shadow(0 7px 10.5px rgba(0,0,0,.02));transition:filter .25s ease}
.fig-btn:hover img{filter:drop-shadow(0 14px 20px rgba(0,0,0,.10))}
.fig figcaption{display:none}
@media (max-width:640px){.fig{flex:1 1 100%!important}}

/* лайтбокс */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(19,19,22,.94);
  display:none;flex-direction:column}
.lightbox.open{display:flex}

/* верхняя полоса: масштаб слева, закрытие справа. Картинка сюда не заходит */
.lightbox-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 20px}
.lightbox-close{width:40px;height:40px;border-radius:50%;flex:0 0 auto;
  background:rgba(255,255,255,.14);color:#fff;font-size:1.3rem;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .18s}
.lightbox-close:hover{background:rgba(255,255,255,.26)}

.lightbox-zoom{display:flex;align-items:center;gap:2px;
  background:rgba(255,255,255,.14);border-radius:20px;padding:4px;color:#fff}
.lightbox-zoom button{width:32px;height:32px;border-radius:50%;background:none;color:#fff;
  font-size:1.15rem;line-height:1;cursor:pointer;transition:background .18s;
  display:flex;align-items:center;justify-content:center}
.lightbox-zoom button:hover{background:rgba(255,255,255,.24)}
.lightbox-zoom button:disabled{opacity:.35;cursor:default;background:none}
.lightbox-zoom .lvl{min-width:52px;text-align:center;font-size:.8rem;
  color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.lightbox-zoom .zoom-fit{width:auto;padding:0 12px;font-size:.8rem;border-radius:16px}

/* середина: только картинка, всё лишнее обрезается по краям области */
.lightbox-stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:0 80px;touch-action:none}
/* листать нечего — поля под стрелки не нужны */
.lightbox.single .lightbox-stage{padding:0 20px}
.lightbox-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;
  cursor:zoom-in;will-change:transform;user-select:none;-webkit-user-drag:none}
.lightbox.zoomed .lightbox-stage img{border-radius:0;cursor:grab}
.lightbox.zoomed .lightbox-stage.grabbing img{cursor:grabbing}
.lightbox.zoomed .lightbox-nav{display:none!important}

/* листание */
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.14);color:#fff;font-size:1.8rem;line-height:1;z-index:2;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .18s}
.lightbox-nav:hover{background:rgba(255,255,255,.26)}
.lightbox-nav.prev{left:16px}
.lightbox-nav.next{right:16px}
.lightbox-nav svg{display:block;flex:0 0 auto}

.lightbox-meta{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:14px 20px;color:rgba(255,255,255,.85);font-size:.9rem;min-height:20px}
.lightbox-meta .count{color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .lightbox-bar{padding:10px 12px}
  .lightbox-stage{padding:0 48px}
  .lightbox.single .lightbox-stage{padding:0 8px}
  .lightbox-nav{width:38px;height:38px}
  .lightbox-nav svg{width:18px;height:18px}
  .lightbox-nav.prev{left:5px}
  .lightbox-nav.next{right:5px}
  .lightbox-zoom .zoom-fit{padding:0 10px}
}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:var(--small);color:var(--muted)}
.life-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.points a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.life-text a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.life-tag{text-decoration:none;transition:color .2s,border-color .2s}
.life-tag:hover{color:var(--accent);border-color:var(--accent)}
.jtbd{font-size:var(--small);color:var(--muted);margin-bottom:12px}
.jtbd b{color:var(--ink);font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:24px}
.gallery .shot{aspect-ratio:3/4}


/* шапка страницы = блок опыта с главной (переиспользуем) */
.exp-eyebrow{font-size:var(--small);color:var(--faint);font-variant-numeric:tabular-nums}
.exp-role{font-weight:700;font-size:var(--h1);line-height:1.2;margin-top:6px;letter-spacing:-.02em}
.exp-company{color:var(--accent)}
.exp-summary{margin-top:10px;color:var(--muted)}
/* обязанности: видны сразу, подрезаны, раскрываются кнопкой */
.duties{position:relative;overflow:hidden;max-height:340px;transition:max-height .35s ease;margin-top:16px}
.duties.open{max-height:none}
.duties::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;
  background:linear-gradient(to bottom,rgba(252,252,253,0),var(--bg));pointer-events:none;transition:opacity .25s}
.duties.open::after{opacity:0}
.duties-more{margin-top:10px;display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-weight:500;font-size:var(--small)}
.duties-more .chev{transition:transform .2s}
.duties-more:hover .chev{transform:translateY(2px)}
.duties-more.hidden{display:none}
/* дайджест достижений */
.achievements{margin-top:clamp(36px,5vh,52px)}
.section-head{font-size:var(--eyebrow);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
/* шапка отделена от кейсов */
.head-sep{margin:100px 0;height:4px;background:var(--accent);border-radius:2px}
.duties-inner{padding-top:0}
.duties ul{list-style:none;display:flex;flex-direction:column;gap:9px;max-width:62ch}
.duties li{position:relative;padding-left:18px;color:var(--ink);font-size:var(--text)}
.duties li::before{content:"✦";position:absolute;left:0;top:0;color:var(--accent);font-size:.85rem;line-height:1;display:flex;align-items:center;height:calc(var(--text) * 1.6)}
/* пункт-подзаголовок (целиком жирный) — без маркера */
.duties li:has(> b:only-child){padding-left:0;color:var(--ink);font-weight:600;margin-top:10px}
.duties li:has(> b:only-child)::before{display:none}


.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:18px}
.side-links{display:flex;flex-direction:row;flex-wrap:wrap;gap:14px;font-size:var(--text)}
.side-links a{color:var(--accent);width:fit-content;transition:opacity .15s}
.side-links a:hover{opacity:.65}
.side-tabs{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.segmented{display:flex;gap:2px;background:var(--sel);padding:3px;border-radius:10px}
.segmented button{padding:6px 11px;border-radius:7px;font-weight:500;font-size:var(--eyebrow);color:var(--muted);white-space:nowrap;transition:background .18s,color .18s}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,20,25,.06)}
.lang{display:inline-flex;gap:2px;font-size:var(--eyebrow);font-weight:500;background:var(--sel);padding:3px;border-radius:10px}
.lang button{padding:6px 11px;border-radius:7px;color:var(--faint)}
.lang button[aria-pressed="true"]{color:var(--ink);background:var(--surface);box-shadow:0 1px 2px rgba(20,20,25,.06)}

.shell{display:flex;min-height:100vh}
.sidebar{view-transition-name:side-col;width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:0;align-self:flex-start;
  height:100vh;overflow-y:auto;padding:var(--pad);padding-right:clamp(48px,9vw,170px);display:flex;flex-direction:column;gap:24px;background:var(--bg)}
.main{view-transition-name:main-col;flex:1 1 auto;min-width:0;padding:var(--pad);padding-left:clamp(32px,4vw,80px)}
.main-inner{max-width:820px}

.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:500;font-size:var(--small)}
.back:hover{color:var(--accent)}




/* блок = один раздел */
/* кейс — без подложки, разделение воздухом */
.block{margin-top:120px;scroll-margin-top:20px}
.block:first-of-type{margin-top:0}
.block-num{font-size:var(--eyebrow);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.block-title{font-weight:700;font-size:var(--h2);letter-spacing:-.02em;margin-top:8px;line-height:1.2}
.block-lead{color:var(--muted);margin-top:10px;max-width:60ch}

.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px 26px;margin-top:24px;padding:22px 0;border-top:1px solid rgba(19,19,22,.08);border-bottom:1px solid rgba(19,19,22,.08)}
.meta h4{font-size:var(--eyebrow);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:7px}
.meta p{font-size:var(--small)}
.meta .dim{color:var(--muted)}
.goal{display:inline-flex;align-items:center;gap:5px;background:var(--accent-weak);color:var(--accent);font-weight:600;font-size:var(--small);padding:3px 9px;border-radius:20px;margin-top:4px}

.sub{margin-top:16px}                 /* внутреннее: подсекция под заголовком */
.sub + .sub{margin-top:40px}          /* внешнее: между подсекциями */
.sub > *:first-child{margin-top:0}    /* первый элемент подсекции не отрывается */
.sub > .points:first-child{margin-top:0}  /* список сразу под заголовком блока */
.sub-title{font-weight:700;font-size:var(--h3);letter-spacing:-.01em}
.sub-title ~ .points,.sub-title ~ .sub-note{margin-top:12px}
.sub-note{color:var(--ink);margin-top:0;max-width:56ch;font-size:var(--text)}

.jtbd{font-size:var(--small);color:var(--muted);margin-bottom:12px}
.jtbd b{color:var(--ink);font-weight:600}




.foot{margin-top:80px;padding:32px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot a{color:var(--accent);font-weight:500;font-size:var(--small)}



.topbar{display:none}
@media (max-width:900px){
  .shell{flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;padding:14px var(--pad);background:var(--bg);border-bottom:1px solid var(--line)}
  .burger{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
  .burger span{width:18px;height:2px;background:var(--ink);border-radius:2px}
  .sidebar{position:fixed;inset:0 0 0 auto;width:min(88vw,340px);z-index:50;transform:translateX(100%);transition:transform .28s ease;box-shadow:-20px 0 60px rgba(20,20,25,.08)}
  body.nav-open .sidebar{transform:translateX(0)}
  .scrim{position:fixed;inset:0;background:rgba(20,20,25,.3);opacity:0;pointer-events:none;transition:.28s;z-index:45}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
}
@media (min-width:901px){.scrim{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>

<script>
/* ============================================================
   СОДЕРЖИМОЕ СТРАНИЦ «РАБОТА + ЖИЗНЬ»
   Правится визуальным редактором: life.html?id=…&crm
   Поля: when, role, desc, links, parts (см. assets/v4-life.js)
============================================================ */
/*CRM_LIFE_S*/const LIFE = {
  site:{
    ru:{desc:"Сайт портфолио. Я спроектировал и собрал его вместе с нейросетью Claude",
      parts:[
        {h:"Какой опыт я получил", paras:[
          "До этого я уже использовал нейросети, чтобы делать дизайн и писать тексты. А вот сайт с нейросетью я собрал впервые, и именно здесь. Claude писал код и вёрстку. Я ставил задачи, выбирал варианты и принимал решения.",
          "Чтобы сайт заработал, мне пришлось разобраться с GitHub. Раньше это не был мой инструмент. Теперь сайт живёт в репозитории, и я понимаю, как через него идут изменения и публикация.",
          "Для сайта нужны были десятки картинок. Я искал быстрый и бесплатный сервис, который сразу сжимает и обрабатывает много изображений. Перепробовал многие сервисы для редактирования картинок и выбрал <a href='https://to.imagestool.com/' target='_blank' rel='noopener'>to.imagestool.com</a>, потому что он умеет массовую обработку и стоит ноль.",
          "Тексты кейсов я переводил на английский прямо в Figma, чтобы у сайта были две полные версии.",
          "Портфолио я собирал из старых файлов. В части проектов в Figma слетели шрифты, и я искал их и устанавливал заново. Некоторые проекты были сделаны, когда в Figma ещё не было автолейаута. Там всё съехало, и я выравнивал это вручную. Ещё часть проектов я делал в Sketch и Photoshop, и от них остались только картинки.",
          "Концепцию сайта я менял несколько раз. Я хотел сделать функциональную и простую вещь без наворотов, и менял подход, пока не добился именно этого."]},
        {h:"Кем вдохновлялся", paras:[
          "В каждом из этих дизайнеров мне что-то понравилось. У кого-то структура, у кого-то визуал, у кого-то подача, а у кого-то эмоции. Я благодарен им и восхищаюсь их сайтами."],
          tags:[{t:"urzhanovaa.com", href:"https://urzhanovaa.com"}, {t:"olenkevich.com", href:"https://olenkevich.com/"}, {t:"ivanzviahin.com", href:"https://ivanzviahin.com/"}, {t:"readymag.website/u1964621708", href:"https://readymag.website/u1964621708/5730127/"}, {t:"garri.design", href:"https://garri.design/"}, {t:"steblina.com", href:"https://www.steblina.com/"}, {t:"gkvasnikov.com", href:"https://www.gkvasnikov.com/"}, {t:"elizque.framer.website", href:"https://elizque.framer.website/"}, {t:"morretrf.com", href:"https://morretrf.com/"}, {t:"kefiijrw.com", href:"https://kefiijrw.com/"}]}]},
    en:{desc:"Portfolio site. I designed and built it together with the Claude neural network",
      parts:[
        {h:"What experience I gained", paras:[
          "Before this I had already used neural networks to do design and write copy. But I built a site with a neural network for the first time, and here. Claude wrote the code and the layout. I set the tasks, chose the options and made the decisions.",
          "To make the site work I had to figure out GitHub. It had never been my tool. Now the site lives in a repository, and I understand how changes and publishing go through it.",
          "The site needed dozens of images. I was looking for a fast and free service that compresses and processes many images at once. I tried many image editing services and chose <a href='https://to.imagestool.com/' target='_blank' rel='noopener'>to.imagestool.com</a>, because it handles bulk processing and costs nothing.",
          "I translated the case texts into English right in Figma, so that the site has two full versions.",
          "I put the portfolio together from old files. In some projects the fonts had broken in Figma, and I had to find and reinstall them. Some projects were made when Figma did not yet have auto layout. Everything shifted there, and I fixed it by hand. Other projects I made in Sketch and Photoshop, and only images are left of them.",
          "I changed the concept of the site several times. I wanted to make something functional and simple, without frills, and I kept changing the approach until I got exactly that."]},
        {h:"Inspired by", paras:[
          "I liked something in each of these designers. In some it is the structure, in some the visuals, in some the way things are presented, and in some the emotions. I am grateful to them and I admire their sites."],
          tags:[{t:"urzhanovaa.com", href:"https://urzhanovaa.com"}, {t:"olenkevich.com", href:"https://olenkevich.com/"}, {t:"ivanzviahin.com", href:"https://ivanzviahin.com/"}, {t:"readymag.website/u1964621708", href:"https://readymag.website/u1964621708/5730127/"}, {t:"garri.design", href:"https://garri.design/"}, {t:"steblina.com", href:"https://www.steblina.com/"}, {t:"gkvasnikov.com", href:"https://www.gkvasnikov.com/"}, {t:"elizque.framer.website", href:"https://elizque.framer.website/"}, {t:"morretrf.com", href:"https://morretrf.com/"}, {t:"kefiijrw.com", href:"https://kefiijrw.com/"}]}]}
  },
  assist:{
    links:{site:"https://digitalbase.ru/products"},
    ru:{when:"Январь 2026 — Сейчас", role:"Product Designer",
      desc:"АссистПРО — стартап. Система поиска, обоснования и защиты дополнительного бюджета проекта",
      parts:[
        {h:"О продукте", paras:["Продукт помогает найти дополнительный бюджет для проекта, обосновать его и защитить."]},
        {h:"Что я сделал", paras:["Я единственный дизайнер в продукте. Поэтому дизайн целиком на мне, от первых идей до проработки сложных сценариев. Я сам решаю, что делать в первую очередь, и сам отвечаю за результат."]},
        {h:"Нейросеть и Figma", paras:["Сначала я использовал нейросеть, чтобы быстро набросать базу для дизайна. Так не пришлось начинать с чистого листа, и направление стало видно сразу.","Потом я перешёл в Figma. Там я собрал дизайн-систему и вручную проработал сложные кейсы, потому что именно в них важны детали и логика. Нейросеть ускорила начало, а качество довёл я."]},
        {h:"Макеты", shots:3}]},
    en:{when:"Jan 2026 — Now", role:"Product Designer",
      desc:"AssistPRO — a startup. A system to find, justify and defend additional project budget",
      parts:[
        {h:"About the product", paras:["The product helps to find additional budget for a project, justify it and defend it."]},
        {h:"What I did", paras:["I am the only designer on the product. So the design is entirely on me, from the first ideas to the complex scenarios. I decide what to do first, and I am responsible for the result."]},
        {h:"Neural network and Figma", paras:["At first I used a neural network to quickly sketch a base for the design. That way I did not have to start from a blank page, and the direction was clear right away.","Then I moved to Figma. There I built the design system and worked out the complex cases by hand, because details and logic matter most in them. The neural network sped up the start, and I brought the quality."]},
        {h:"Screens", shots:3}]}
  },
  shtang:{
    ru:{desc:"Курс Игоря Штанга «Таблицы»",
      parts:[
        {h:"О курсе", paras:["Курс посвящён таблицам в интерфейсах. Это один из самых частых и самых сложных элементов в рабочих продуктах. В таблице много данных, много действий и много людей, которым с ней работать каждый день.","Курс разбирает, как спроектировать такую таблицу, чтобы она не превращалась в стену цифр."]},
        {h:"Почему я его прошёл", paras:["Таблицы встречаются почти в каждом рабочем продукте, а хорошо сделать их непросто. Поэтому я решил разобраться в теме системно, а не решать задачу заново каждый раз."]},
        {h:"Какой опыт я получил", list:[
          "Я стал смотреть на таблицу как на рабочий инструмент. Теперь начинаю с вопросов, что человек в ней ищет, что сравнивает и какие действия делает чаще всего",
          "Появилась система. Я понимаю, из каких частей собирается таблица, и подбираю их под конкретную задачу",
          "Мне проще объяснять решения команде и продакту, потому что за ними стоят понятные принципы",
          "Применяю это в B2B-продуктах, где таблицы и списки составляют основу интерфейса"]},
        {h:"Что понравилось", paras:["Курс узкий и практичный. Одна тема разобрана до мелочей, поэтому знания можно сразу применять в работе."]},
        {h:"Ссылка", tags:[{t:"igorshtang.ru/course/tables", href:"https://www.igorshtang.ru/course/tables"}]}]},
    en:{desc:"Igor Shtang’s course “Tables”",
      parts:[
        {h:"About the course", paras:["The course is about tables in interfaces. It is one of the most common and most complex elements in working products. A table holds a lot of data, a lot of actions and a lot of people who work with it every day.","The course shows how to design such a table so that it does not turn into a wall of numbers."]},
        {h:"Why I took it", paras:["Tables appear in almost every working product, and it is not easy to do them well. So I decided to understand the topic systematically, instead of solving the task from scratch each time."]},
        {h:"What experience I gained", list:[
          "I started to see a table as a working tool. Now I begin with questions about what a person looks for in it, what they compare and which actions they do most often",
          "I got a system. I understand what a table is made of, and I choose the parts for a specific task",
          "It is easier for me to explain decisions to the team and the product manager, because clear principles stand behind them",
          "I use it in B2B products, where tables and lists are the core of the interface"]},
        {h:"What I liked", paras:["The course is narrow and practical. One topic is covered in detail, so the knowledge can be used at work right away."]},
        {h:"Link", tags:[{t:"igorshtang.ru/course/tables", href:"https://www.igorshtang.ru/course/tables"}]}]}
  },

  mts:{
    ru:{when:"2024", role:"Senior UX/UI Designer", desc:"Мобильное приложение «МТС Умный дом» для управления умным домом",
      parts:[
        {h:"О приложении", paras:["«МТС Умный дом» — приложение для управления домом. В нём человек подключает устройства, собирает их в одном месте и настраивает сценарии. Например, «ушёл из дома, и свет выключился».","Для дизайна это непростая задача. Устройств много, они разные, а пользователю нужно, чтобы всё работало просто и понятно."]},
        {h:"Что я делал", list:[
          "Меня взяли в команду как Senior-дизайнера, и я сразу включился в работу над мобильным приложением",
          "Занимался сценариями управления устройствами и настройкой автоматизаций",
          "Разбирался в логике продукта вместе с продактом и разработкой, чтобы решения были понятны всей команде"]},
        {h:"Чем всё закончилось", paras:["Через два месяца в компании начались массовые сокращения, и я попал под них. Я ушёл с компенсацией."]},
        {h:"Какой опыт я получил", paras:["Я попал в крупную компанию на роль Senior-дизайнера и быстро вошёл в продукт с большим числом устройств и сценариев. Этот опыт показал мне, как устроена работа над сложным мобильным продуктом внутри большой команды."]},
        {h:"Ссылка", tags:[{t:"Приложение в App Store", href:"https://apps.apple.com/ru/app/%D0%BC%D1%82%D1%81-%D1%83%D0%BC%D0%BD%D1%8B%D0%B9-%D0%B4%D0%BE%D0%BC/id6444015366"}]},
        {h:"Макеты", shots:3}]},
    en:{when:"2024", role:"Senior UX/UI Designer", desc:"MTS Smart Home, a mobile app for controlling a smart home",
      parts:[
        {h:"About the app", paras:["MTS Smart Home is an app for running a home. In it a person connects devices, keeps them in one place and sets up scenarios. For example, “I left home, and the lights went off”.","This is not an easy task for design. There are many devices, they are all different, and the user needs everything to work simply and clearly."]},
        {h:"What I did", list:[
          "I was hired into the team as a Senior designer and got straight into work on the mobile app",
          "I worked on the flows for controlling devices and on setting up automations",
          "I worked through the product logic with the product manager and developers, so that the decisions were clear to the whole team"]},
        {h:"How it ended", paras:["Two months later the company started mass layoffs and I was among those affected. I left with compensation."]},
        {h:"What experience I gained", paras:["I joined a large company as a Senior designer and quickly got into a product with many devices and scenarios. This experience showed me how work on a complex mobile product goes inside a large team."]},
        {h:"Link", tags:[{t:"The app in the App Store", href:"https://apps.apple.com/ru/app/%D0%BC%D1%82%D1%81-%D1%83%D0%BC%D0%BD%D1%8B%D0%B9-%D0%B4%D0%BE%D0%BC/id6444015366"}]},
        {h:"Screens", shots:3}]}
  },
  birman:{
    ru:{desc:"Курс Ильи Бирмана «Пользовательский интерфейс и представление информации» в Бюро Горбунова",
      parts:[
        {h:"О курсе", paras:["Это курс Ильи Бирмана в Бюро Горбунова о том, как устроены интерфейсы и как правильно показывать информацию. В нём нет моды и случайных решений. Всё строится на понятных принципах, таких как иерархия, группировка и единый стиль."]},
        {h:"Почему я его прошёл", paras:["Илью Бирмана и Бюро я читал задолго до курса. Хотелось получить базу напрямую от автора и понять не просто как принято делать, а почему это работает."]},
        {h:"Какой опыт я получил", list:[
          "Я обосновываю решения принципами, а не вкусом, и могу объяснить команде, почему интерфейс сделан именно так",
          "Замечаю мелкие ошибки в подаче информации, в иерархии, подписях и типографике",
          "Это база, к которой я возвращаюсь в каждом проекте"]},
        {h:"Читаю и советую", paras:["Я читаю Илью и Бюро давно и продолжаю читать до сих пор. Это для меня источник, из которого я учусь постоянно, а не один раз. Советую начать с этих материалов каждому, кто делает интерфейсы."]},
        {h:"Ссылка", tags:[{t:"bureau.ru/lectures/ui", href:"https://bureau.ru/lectures/ui/"}]}]},
    en:{desc:"Ilya Birman’s course on user interface and information design at Gorbunov Bureau",
      parts:[
        {h:"About the course", paras:["This is Ilya Birman’s course at Gorbunov Bureau about how interfaces work and how to present information properly. There is no fashion and no random decisions in it. Everything is built on clear principles, such as hierarchy, grouping and a consistent style."]},
        {h:"Why I took it", paras:["I had been reading Ilya Birman and the Bureau long before the course. I wanted the basics straight from the author, and to understand not just how things are usually done, but why they work."]},
        {h:"What experience I gained", list:[
          "I justify decisions with principles, not taste, and I can explain to the team why an interface is built the way it is",
          "I notice small mistakes in how information is presented, in hierarchy, labels and typography",
          "It is the base I come back to in every project"]},
        {h:"I read it and recommend it", paras:["I have been reading Ilya and the Bureau for a long time and I still do. For me it is a source I learn from all the time, not once. I recommend starting with these materials to everyone who designs interfaces."]},
        {h:"Link", tags:[{t:"bureau.ru/lectures/ui", href:"https://bureau.ru/lectures/ui/"}]}]}
  },
  mda:{
    ru:{desc:"Moscow Digital Academy, курс «Digital, UX/UI»",
      parts:[
        {h:"О курсе", paras:["Курс по digital-дизайну (UX/UI) в Moscow Digital Academy. Занятия проходили вживую, в группе дизайнеров, которые, как и я, только входили в профессию."]},
        {h:"Моя роль и защита проекта", paras:["В нашей группе я был главным по проекту. В конце курса я вышел перед всеми, представил наш проект и защищал его решения. Я рассказывал, почему мы сделали именно так, и отвечал на вопросы.","Выступать было волнительно, но именно на защите я понял, что умею удерживать внимание и отстаивать решения."]},
        {h:"Какой опыт я получил", list:[
          "Опыт публичного выступления и защиты своей работы перед группой",
          "Опыт работы над общим проектом от идеи до защиты, где я отвечал за результат команды",
          "Живые занятия, на которых можно было сразу задать вопрос и разобрать задачу на месте",
          "Группа таких же дизайнеров. Мы обсуждали работы друг друга и видели, как одну задачу решают по-разному"]},
        {h:"Ссылка", tags:[{t:"m-d-a.ru/digital-design", href:"https://m-d-a.ru/digital-design"}]}]},
    en:{desc:"Moscow Digital Academy, Digital, UX/UI course",
      parts:[
        {h:"About the course", paras:["A course in digital design (UX/UI) at Moscow Digital Academy. Classes were live, in a group of designers who, like me, were just entering the profession."]},
        {h:"My role and the project defence", paras:["In our group I was the lead on the project. At the end of the course I stood up in front of everyone, presented our project and defended its decisions. I explained why we had done it this way and answered questions.","It was nerve-racking, but at the defence I realised that I can hold attention and stand up for decisions."]},
        {h:"What experience I gained", list:[
          "Experience of speaking in public and defending my work in front of a group",
          "Experience of working on a shared project from the idea to the defence, where I was responsible for the team’s result",
          "Live classes, where I could ask a question right away and work through a task on the spot",
          "A group of designers like me. We discussed each other’s work and saw how one task can be solved in different ways"]},
        {h:"Link", tags:[{t:"m-d-a.ru/digital-design", href:"https://m-d-a.ru/digital-design"}]}]}
  },
  freelance:{
    ru:{when:"Май 2016 — Март 2017", role:"Junior UX/UI Designer",
      desc:"Фриланс. Дизайн-студия. Ивент-агентство",
      parts:[
        {h:"Фриланс", paras:["Параллельно я делал сайты на WordPress. Заказы приходили от знакомых и знакомых знакомых, а денег я брал совсем немного.","Для меня это была практика. Я проходил путь от разговора с заказчиком до работающего сайта и видел, как мои решения живут в реальном проекте."]},
        {h:"Дизайн-студия", paras:["Это тоже был классный опыт. Я познакомился с крутым человеком, который держал студию. Он вдохновлял меня тем, какой он умный и как много работает.","Мы иногда работали до утра и вместе ходили на обед. Внутри была классная команда. В молодом коллективе бывало и сложно, но это тоже опыт.","Было много интересных проектов. Я вспоминаю то время с теплотой."]},
        {h:"Ивент-агентство", paras:["Это было моё первое официальное трудоустройство как дизайнера. Я помню, как сильно нервничал. Собеседование проходило офлайн, с директором, и я долго к нему готовился.","В офисе я работал в паре с креативщиком, который давал мне задания. Я рисовал разные лендинги и картинки для соцсетей. Проработал там недолго, но опыт получился очень полезным."]},
        {h:"Какой опыт я получил", paras:["За этот год я прошёл путь от сайтов для знакомых до работы в студии и в агентстве. Я попробовал свободную работу, команду, где иногда работали до утра, и первое официальное место. Это основа, на которой я потом вырос в Senior-дизайнера."]},
        {h:"Работы", tags:[{t:"2016. Проекты на Behance", href:"https://www.behance.net/maksimdesigner"}]}]},
    en:{when:"May 2016 — Mar 2017", role:"Junior UX/UI Designer",
      desc:"Freelance. Design studio. Event agency",
      parts:[
        {h:"Freelance", paras:["At the same time I built WordPress websites. The orders came from friends and friends of friends, and I charged very little.","For me it was practice. I went the whole way from talking to a client to a working website and saw how my decisions live in a real project."]},
        {h:"Design studio", paras:["This was a great experience too. I met a remarkable person who ran the studio. He inspired me with how smart he was and how much he worked.","We sometimes worked until morning and went to lunch together. The team inside was great. In a young team it was sometimes hard, but that is experience too.","There were many interesting projects. I remember that time with warmth."]},
        {h:"Event agency", paras:["This was my first official job as a designer. I remember how nervous I was. The interview was offline, with the director, and I had prepared for it for a long time.","In the office I worked in a pair with a creative colleague who gave me tasks. I drew different landing pages and pictures for social media. I did not stay long, but the experience was very useful."]},
        {h:"What experience I gained", paras:["Over this year I went from websites for friends to working in a studio and an agency. I tried freelance work, a team where we sometimes worked until morning, and a first official job. This is the base on which I later grew into a Senior designer."]},
        {h:"Works", tags:[{t:"2016. Projects on Behance", href:"https://www.behance.net/maksimdesigner"}]}]}
  },
  gym:{
    ru:{desc:"Онлайн-курс Данила Фимушкина «Design:GYM 3.0»",
      parts:[
        {h:"О курсе", paras:["Design:GYM — это онлайн-курс Данила Фимушкина по дизайну интерфейсов. У Данила есть свой YouTube-канал, ссылка на него ниже."]},
        {h:"Как это было", paras:["После магазина игрушек я решил менять профессию и искать себя. Нужно было с чего-то начинать, и Design:GYM стал моим первым купленным курсом. Я сам вложил в это деньги и время, потому что решил всерьёз заняться дизайном.","Курс очень помог мне в своё время. Он дал основу, на которую потом легло всё остальное обучение, и уверенность, что я иду в правильном направлении."]},

const SHORT_WORDS = [
  // предлоги
  "в","во","на","за","к","ко","с","со","о","об","обо","от","ото","по","до","из","изо",
  "у","для","при","про","над","под","без","перед","через","между","около","среди","после",
  // союзы и частицы
  "и","а","но","ни","не","же","ли","бы","то","что","как","чтобы","или","либо","если","так",
  // местоимения
  "я","мы","он","она","оно","они","их","его","её","мой","моя","моё","наш","эта","это","этот","все","всё",
  // англ.
  "a","an","the","in","on","at","to","of","for","and","or","with","by","from","as","is","are","was","we","i","it","my","our"
];

function fixOrphans(root){
  if(!root) return;
  const re = new RegExp("(^|[\\s(«\"„—–-])(" + SHORT_WORDS.join("|") + ")[ \\t\\r\\n]+", "gi");   // после короткого слова — только обычный пробел, иначе цепочки «и по этим» не склеиваются
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    let t = n.nodeValue;
    if(!t || !t.trim()) return;
    // короткие слова склеиваем со следующим
    let prev;
    do { prev = t; t = t.replace(re, (m,a,w)=> a + w + "\u00A0"); } while(t !== prev);
    // тире не должно начинать строку
    t = t.replace(/\s+([—–])\s/g, "\u00A0$1 ");
    // разряды в числах не рвутся: 10 000
    t = t.replace(/(\d)\s(?=\d{3}\b)/g, "$1\u00A0");
    if(t !== n.nodeValue) n.nodeValue = t;
  });
}

function part(p){
  let body = "";
  if(p.list)  body += `<ul class="points">${p.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(p.text)  body += `<p class="life-text">${p.text}</p>`;
  if(p.paras) body += p.paras.map(x=>`<p class="life-text">${x}</p>`).join("");
  if(p.ph)    body += `<div class="life-ph"><span class="ph-l">${T[L].fill}. </span><span class="ph-t">${p.ph}</span></div>`;
  if(p.links) body += `<ul class="life-links">${p.links.map(x=>x.href
      ? `<li><a href="${x.href}"${/^https?:/.test(x.href)?' target="_blank" rel="noopener"':''}>${x.t}</a>${x.note?` <span class="life-note">— ${x.note}</span>`:""}</li>`
      : `<li class="life-ph">${T[L].fill}: ${x.ph}</li>`).join("")}</ul>`;
  if(p.tags)  body += `<div class="life-tags">${p.tags.map(x=>`<a class="chip life-tag" href="${x.href}" target="_blank" rel="noopener">${x.t}</a>`).join("")}</div>`;
  if(p.shots) body += `<div class="shots">${Array.from({length:p.shots},()=>`<div class="shot">${T[L].photo}</div>`).join("")}</div>`;
  const kind = p.list?"list":p.paras?"paras":p.text!==undefined?"text":p.ph!==undefined?"ph":p.links?"links":p.tags?"tags":p.shots?"shots":"";
  return `<section class="life-part" data-kind="${kind}"><h2 class="life-h">${p.h}</h2>${body}</section>`;
}

}

}
