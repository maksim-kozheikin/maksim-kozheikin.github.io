<head>
<meta charset="UTF-8">

<meta name="description" content="Максим Кожейкин — продуктовый дизайнер. FinTech, MedTech и e-commerce. Проектирую продукты и выстраиваю дизайн-команды.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* бесшовные переходы между отдельными страницами */

::view-transition-old(main-col){animation:fOut .16s ease both}
::view-transition-new(main-col){animation:fIn .22s ease both}
@keyframes fOut{to{opacity:0;transform:translateY(-4px)}}
@keyframes fIn{from{opacity:0;transform:translateY(6px)}}

:root{
  --bg:#FCFCFD; --surface:#FFFFFF; --ink:#131316; --muted:#6C6C74; --faint:#9A9AA2;
  --line:#EBEBEF; --accent:#F0523C; --sel:#F1F1F4;
  /* ТИПОГРАФИЧЕСКАЯ ШКАЛА — 5 ступеней, других размеров в проекте нет
     --h1  Заголовок раздела:  «Кабинет врача», «Приложение SmartMed»
     --h2  Заголовок кейса:    «Расписание», «Главный экран»
           Заголовок страницы: «Lead UX/UI Designer · Medsi Digital»
     --h3  Подзаголовок:       «Проблемы», «Результат»
     --text  Основной текст:   пункты списков, описания, обязанности
     --small Вторичный текст:  чипы, подписи, навигация, мета
     --eyebrow Надзаголовок:   «КЕЙС 05», рубрики, метки  */
  --h1:clamp(2rem,3.4vw,2.9rem);
  --h2:clamp(1.6rem,2.2vw,2rem);
  --h3:1.02rem;
  --text:.98rem;
  --small:.88rem;
  --eyebrow:.72rem;
  --sans:"Golos Text",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --sidebar-w:clamp(320px,31vw,480px);
  --pad:clamp(20px,3vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}


/* ============================================================
   КОМПОНЕНТЫ — переиспользуются везде. Новых не заводим.
   .row   — строка списка (проекты, образование, портфолио)
   .card  — карточка (проблемы, решения, цели, результаты)
   .shot  — плейсхолдер изображения
   .chip  — тег
============================================================ */
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:baseline;padding:11px 2px;border-top:1px solid var(--line);
  transition:padding-left .18s,color .18s}
.list > .row:last-child,.list > a.row:last-of-type{border-bottom:1px solid var(--line)}
a.row:hover{padding-left:7px}
.row-yr{flex:0 0 82px;font-size:var(--small);color:var(--faint);font-variant-numeric:tabular-nums}
.row-ti{font-size:var(--text);line-height:1.4}
.row-arr{margin-left:auto;color:var(--faint);font-size:var(--text);line-height:1;align-self:center;transition:transform .2s,color .2s}
.chip-tag ~ .row-arr{margin-left:10px}
a.row:hover .row-arr{transform:translateX(3px)}
a.row[aria-current="page"] .row-arr{transform:rotate(90deg)}
a.row[aria-current="page"] .row-ti{color:var(--accent);font-weight:600}
a.row[aria-current="page"] .row-arr{color:var(--accent)}

.subnav{display:flex;flex-direction:column;padding:4px 0 10px 94px;gap:2px}
.subnav a{color:var(--muted);font-size:var(--small);transition:color .15s,padding-left .15s}
.subnav a:hover{color:var(--accent);padding-left:4px}
.subnav a.active{color:var(--accent);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{font-weight:600;font-size:var(--h3);margin-bottom:9px}
.card p{color:var(--muted);font-size:var(--text)}
/* метрика — только цифра и подпись, разделение воздухом */
.card.metric{background:none;border:none;border-radius:0;padding:0;text-align:left}
.card.metric .num{font-weight:700;font-size:var(--h1);line-height:1.1;letter-spacing:-.03em;color:var(--ink)}
.card.metric .lbl{font-weight:600;margin-top:5px;font-size:.95rem}
.card.metric .desc{color:var(--muted);font-size:.85rem;margin-top:6px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:20px}

.shot{border:1px solid var(--line);border-radius:14px;aspect-ratio:16/9;background:linear-gradient(135deg,#eef2fb,#f7f9fd);
  display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:.85rem;text-align:center;padding:20px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.caption{color:var(--muted);font-size:var(--small);margin-top:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:var(--small);color:var(--muted)}
.chip-tag{margin-left:auto;padding:3px 10px;font-size:var(--eyebrow);flex:0 0 auto}
.chip-btn{cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.chip-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip-life{border-color:var(--ink);color:var(--ink)}

#filters{margin-bottom:16px}

/* ПЛИТКА ПРОЕКТОВ (v4). Внутри те же .row-ti / .row-yr, что и в списке, — редактор их находит */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.4vw,20px)}
.tiles > a.row{display:block;position:relative;padding:0;border:none;border-radius:20px;overflow:hidden;
  aspect-ratio:5/4;background:var(--g,var(--sel));color:#fff;isolation:isolate;transition:none}
.tiles > a.row.wide{grid-column:1 / -1;aspect-ratio:16/6}
.tiles > a.row:last-of-type{border-bottom:none}
.tiles > a.row:hover{padding-left:0}
.tile-img{position:absolute;inset:15% 6% 27%;display:flex;align-items:center;justify-content:center;z-index:-1}
.tile-img img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .4s ease}
.tiles > a.row:hover .tile-img img{transform:scale(1.025)}
.tiles .row-ti{position:absolute;left:clamp(18px,2vw,28px);bottom:clamp(16px,2vw,26px);right:90px;
  font-weight:700;font-size:var(--h2);line-height:1.15;letter-spacing:-.01em;text-shadow:0 1px 14px rgba(0,0,0,.18)}
.tiles .row-yr{position:absolute;top:clamp(16px,2vw,24px);right:clamp(18px,2vw,26px);flex:none;
  color:rgba(255,255,255,.88);font-weight:500}
.tiles .row-arr{position:absolute;right:clamp(18px,2vw,28px);bottom:clamp(18px,2vw,28px);margin:0;
  width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:transform .2s,background .2s}
.tiles > a.row:hover .row-arr{transform:translateX(3px);background:rgba(255,255,255,.34)}
.tiles .chip-tag{position:absolute;top:clamp(14px,2vw,22px);left:clamp(18px,2vw,26px);margin:0;
  border-color:rgba(255,255,255,.5);color:#fff}
/* подпись плитки — по наведению (на тач-экранах видна всегда) */
@media (hover:hover){
  .tiles > a.row .row-ti,.tiles > a.row .row-yr,.tiles > a.row .row-arr,.tiles > a.row .chip-tag{opacity:0;transition:opacity .2s ease,transform .2s ease}
  .tiles > a.row .row-ti{transform:translateY(6px)}
  .tiles > a.row:hover .row-ti,.tiles > a.row:hover .row-yr,.tiles > a.row:hover .row-arr,.tiles > a.row:hover .chip-tag,
  .tiles > a.row:focus-visible .row-ti,.tiles > a.row:focus-visible .row-yr,.tiles > a.row:focus-visible .row-arr{opacity:1;transform:none}
  .tiles > a.row::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(to top,rgba(10,10,15,.55),rgba(10,10,15,.08) 60%,transparent);opacity:0;transition:opacity .2s}
  .tiles > a.row:not(.plain):hover::after{opacity:1}
  .tiles .row-ti,.tiles .row-yr,.tiles .row-arr,.tiles .chip-tag{z-index:1}
  .tile-img{inset:10% 6%}
}
/* личные проекты — без градиента */
.tiles > a.row.plain{color:var(--ink)}
.tiles > a.row.plain .row-ti{text-shadow:none}
.tiles > a.row.plain .row-yr{color:var(--faint)}
.tiles > a.row.plain .row-arr{background:var(--surface);color:var(--ink)}
.tiles > a.row.plain .chip-tag{border-color:var(--line);color:var(--muted)}
@media (max-width:640px){
  .tiles{grid-template-columns:1fr}
  .tiles > a.row,.tiles > a.row.wide{aspect-ratio:4/3}
}
#filters:empty{display:none}
a.row .chip-tag + .row-arr{margin-left:10px}

.shell{display:flex;min-height:100vh}
.sidebar{
  view-transition-name:side-col;
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:0;align-self:flex-start;
  height:100vh;overflow-y:auto;padding:var(--pad);padding-right:clamp(24px,3vw,48px);
  display:flex;flex-direction:column;gap:20px;background:var(--bg);
}
.main{view-transition-name:main-col;flex:1 1 auto;min-width:0;padding:var(--pad);padding-left:clamp(32px,4vw,80px)}
.main-inner{max-width:1240px}
.main-inner .section:not(.section-tiles){max-width:820px}

.side-name{font-weight:700;font-size:clamp(1.4rem,1.8vw,1.75rem);white-space:nowrap;line-height:1.15;letter-spacing:-.02em}
.side-role{margin-top:4px;color:var(--muted);font-weight:500;font-size:var(--small)}
.side-top{display:flex;flex-direction:column;gap:14px}
.side-id{display:flex;align-items:center;gap:14px}
.exp{scroll-margin-top:24px}
.side-top .avatar{width:48px;height:48px;border-radius:12px;background:var(--sel);font-size:16px}
.side-lead{font-weight:500;font-size:1.08rem;line-height:1.4;letter-spacing:-.01em;max-width:30ch}
.side-lead b{font-weight:inherit;color:inherit}
.side-bio{color:var(--muted);font-size:var(--text);max-width:40ch}
.avatar{width:64px;height:64px;border-radius:16px;flex:0 0 auto;background:linear-gradient(135deg,#dfe6ff,#eef1f7);
  display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink);font-size:18px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}


.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.side-links{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;font-size:var(--text)}
.side-links a{color:var(--accent);background:var(--sel);padding:8px 16px;border-radius:999px;width:fit-content;line-height:1.3;transition:background .15s,color .15s}
.side-links a:hover{background:var(--accent);color:#fff}
.side-tabs{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.segmented{display:flex;gap:2px;background:var(--sel);padding:3px;border-radius:10px}
.segmented button{padding:6px 11px;border-radius:7px;font-weight:500;font-size:var(--eyebrow);color:var(--muted);white-space:nowrap;transition:background .18s,color .18s}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,20,25,.06)}
.lang{display:inline-flex;gap:2px;font-size:var(--eyebrow);font-weight:500;background:var(--sel);padding:3px;border-radius:10px}
.lang button{padding:6px 11px;border-radius:7px;color:var(--faint)}
.lang button[aria-pressed="true"]{color:var(--ink);background:var(--surface);box-shadow:0 1px 2px rgba(20,20,25,.06)}

.about-lead{font-weight:700;font-size:var(--h1);line-height:1.25;letter-spacing:-.02em}
.about-lead b{color:inherit}
.about-body{margin-top:18px;color:var(--muted);max-width:56ch;font-size:var(--text)}
.section{margin-top:clamp(48px,7vh,80px)}
.section-head{font-weight:700;font-size:var(--h2);line-height:1.2;letter-spacing:-.01em;margin-bottom:20px}

.exp{padding:clamp(64px,10vh,110px) 0 0}
.exp:first-child{padding-top:0}
.exp-eyebrow{font-size:var(--small);color:var(--faint);font-variant-numeric:tabular-nums}
.exp-role{font-weight:700;font-size:var(--h2);line-height:1.2;margin-top:6px;letter-spacing:-.01em}
.exp-company{color:inherit}
.exp-summary{margin-top:10px;color:var(--muted)}
.toggle{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:var(--small)}
.toggle .chev{transition:transform .2s;color:var(--faint)}
.toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.duties{overflow:hidden;max-height:0;transition:max-height .3s ease}
.duties-inner{padding-top:14px}
.duties ul{list-style:none;display:flex;flex-direction:column;gap:9px;max-width:62ch}
.duties li{position:relative;padding-left:18px;color:var(--muted);font-size:var(--text)}
.duties li::before{content:"✦";position:absolute;left:0;top:0;color:var(--accent);font-size:.85rem;line-height:1;display:flex;align-items:center;height:calc(var(--text) * 1.6)}
/* пункт-подзаголовок (целиком жирный) — без маркера */
.duties li:has(> b:only-child){padding-left:0;color:var(--ink);font-weight:600;margin-top:10px}
.duties li:has(> b:only-child)::before{display:none}
.case-link{margin-top:10px;display:flex;width:fit-content;align-items:center;gap:7px;color:var(--ink);font-weight:500;font-size:var(--small)}
.case-link .arr{transition:transform .18s}
.case-link:hover .arr{transform:translate(2px,-2px)}
.exp-media[hidden]{display:none}
.exp-media{margin-top:20px;border-radius:16px;aspect-ratio:16/10;overflow:hidden;display:flex;align-items:flex-end;padding:20px;border:1px solid var(--line);position:relative}
.exp-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.exp-media .cap{position:relative;font-weight:700;color:#fff;font-size:1.05rem;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.exp-media .yrbig{position:absolute;top:16px;right:20px;font-weight:600;color:rgba(255,255,255,.85);font-size:.85rem}



.cv-view{display:none}
.cv-view.active{display:block}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:500;font-size:.92rem;margin-bottom:28px}
.back:hover{color:var(--ink)}
.cv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.cv-title{font-weight:700;font-size:var(--h1);letter-spacing:-.02em}
.cv-sub{color:var(--muted);margin-top:6px}
.dl-btn{padding:11px 20px;background:var(--accent);color:#fff;border-radius:10px;font-weight:500;white-space:nowrap}
.cv-block{margin-top:32px}
.cv-block h3{font-size:var(--eyebrow);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.cv-item{padding:12px 0;border-top:1px solid var(--line)}
.cv-item .r{font-weight:600}
.cv-item .m{color:var(--muted);font-size:var(--small)}

/* work виден всегда; personal добавляется только в режиме Private */
[data-view="personal"]{display:none}
body[data-mode="life"] [data-view="personal"]{display:block}



.topbar{display:none}
@media (max-width:900px){
  .shell{flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;padding:14px var(--pad);background:var(--bg);border-bottom:1px solid var(--line)}
  .tb-name{font-weight:700}
  .burger{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
  .burger span{width:18px;height:2px;background:var(--ink);border-radius:2px}
  .topbar{display:none!important}
  .sidebar{position:static;width:auto;flex:none;height:auto;overflow:visible;padding:var(--pad)}
  .side-bottom{margin-top:8px}
  .main{padding-top:0;padding-left:var(--pad)}
  .scrim{position:fixed;inset:0;background:rgba(20,20,25,.3);opacity:0;pointer-events:none;transition:.28s;z-index:45}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
}
@media (min-width:901px){.scrim{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.duties{max-height:none!important}.toggle{display:none!important}.sidebar,.topbar,.scrim,.back,.dl-btn,#home{display:none!important}.cv-view{display:block!important}.main{padding:0}}
</style>

/* ============================================================
   ТИПОГРАФИКА: убираем висячие предлоги.
   Текст не меняется — только пробел после коротких слов
   становится неразрывным, чтобы они не висели в конце строки.
============================================================ */
const SHORT_WORDS = [
  // предлоги
  "в","во","на","за","к","ко","с","со","о","об","обо","от","ото","по","до","из","изо",
  "у","для","при","про","над","под","без","перед","через","между","около","среди","после",
  // союзы и частицы
  "и","а","но","ни","не","же","ли","бы","то","что","как","чтобы","или","либо","если","так",
  // местоимения
  "я","мы","он","она","оно","они","их","его","её","мой","моя","моё","наш","эта","это","этот","все","всё",
  // англ.
  "a","an","the","in","on","at","to","of","for","and","or","with","by","from","as","is","are","was","we","i","it","my","our"
];

function fixOrphans(root){
  if(!root) return;
  const re = new RegExp("(^|[\\s(«\"„—–-])(" + SHORT_WORDS.join("|") + ")[ \\t\\r\\n]+", "gi");   // после короткого слова — только обычный пробел, иначе цепочки «и по этим» не склеиваются
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    let t = n.nodeValue;
    if(!t || !t.trim()) return;
    // короткие слова склеиваем со следующим
    let prev;
    do { prev = t; t = t.replace(re, (m,a,w)=> a + w + "\u00A0"); } while(t !== prev);
    // тире не должно начинать строку
    t = t.replace(/\s+([—–])\s/g, "\u00A0$1 ");
    // разряды в числах не рвутся: 10 000
    t = t.replace(/(\d)\s(?=\d{3}\b)/g, "$1\u00A0");
    if(t !== n.nodeValue) n.nodeValue = t;
  });
}

let FILTER = "all";
/* картинки на плитках: id проекта → файл. Остальные плитки — градиент компании */
const TILE_IMG = {
  medsi:{ru:"assets/ru-medsi-One-visual-style.webp", en:"assets/en-medsi-One-visual-style.webp"}
};

function renderProjects(){
  const life = document.body.getAttribute("data-mode")==="life";
  /* в режиме Работа после проектов — плитки «Фриланс» и «Обучение» */
  const EXTRA = [
    {id:"freelance", yr:"2016", ti:{ru:"Фриланс",en:"Freelance"}, href:"life.html?id=freelance"},
    {id:"education", yr:"2010 — 2026", ti:{ru:"Обучение",en:"Education"}, href:"life.html?id=education"}
  ];
  const all = life ? [...PROJECTS, ...PERSONAL_PROJECTS] : [...PROJECTS, ...EXTRA];
  const items = (FILTER==="all") ? all : all.filter(p=>p.tag===FILTER);

  // фон плитки — градиент компании из EXPERIENCE, картинка — если есть
  const grad = Object.fromEntries(EXPERIENCE.map(e=>[e.case.href, e.grad]));
  /* Работа + Жизнь — мозаика: плитка под каждую строку слева (assets/v4-tiles.js) */
  /* обе вкладки — мозаика: «Работа» из V4_WORK_TILES, «Работа + Жизнь» по таймлайну (assets/v4-tiles-data.js) */
  $("#projects").classList.add("mosaic");
  {
    $("#projects").dataset.mode = life ? "life" : "work";
    $("#projects").innerHTML = v4Mosaic(LANG, life ? "life" : "work");
    v4TilesBindEditor($("#projects"), renderProjects);
    $("#filters").innerHTML = "";
    return;
  }
  $("#projects").innerHTML = items.map((p,i)=>{
    const g = grad[p.href];
    const img = TILE_IMG[p.id] ? TILE_IMG[p.id][LANG] : "";
    const cls = ["row", i%3===2 ? "wide" : "", g ? "" : "plain"].join(" ").trim();
    return `
    <a class="${cls}" href="${p.href}"${g?` style="--g:${g}"`:""}>
      ${img ? `<span class="tile-img"><img src="${img}" alt="" loading="lazy"></span>` : ""}
      <span class="row-yr">${p.yr}</span>
      <span class="row-ti">${p.ti[LANG]}</span>
      ${life ? `<span class="chip chip-tag">${TAGS[p.tag][LANG]}</span>` : ""}
      <span class="row-arr">›</span>
    </a>`;}).join("");

  // фильтры — только в режиме Work + Life
  const box = $("#filters");
  if(!life){ box.innerHTML=""; return; }
  const tags = ["all", ...new Set(all.map(p=>p.tag))];
  box.innerHTML = tags.map(t=>
    `<button class="chip chip-btn" data-filter="${t}" aria-pressed="${FILTER===t}">${
      t==="all" ? (LANG==="ru"?"Все":"All") : TAGS[t][LANG]}</button>`).join("");
  box.querySelectorAll("[data-filter]").forEach(b=>
    b.addEventListener("click",()=>{ FILTER=b.getAttribute("data-filter"); renderProjects(); }));
}

      <p class="exp-meta">${v4Summary(e.summary[LANG], v4Links(v4IdByHref(e.case.href), LANG))}</p>
      ${v4HeadChips(v4Entry(v4IdByHref(e.case.href)), LANG, e.date[LANG], v4IdByHref(e.case.href) ? "" : (LANG==="ru"?"Работа":"Work"))}
