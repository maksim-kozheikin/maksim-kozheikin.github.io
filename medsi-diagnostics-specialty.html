<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a diagnostic test · MEDSI</title>
  <link rel="stylesheet" href="assets/medsi/smartmed-diagnostics/select.css">
  <link rel="stylesheet" href="assets/medsi/smartmed-diagnostics/entry.css">
  <script src="assets/medsi/smartmed-diagnostics/diagnostic-picker.js" defer></script>
</head>
<body>
  <main class="phone specialty">
    <header class="navigation">
      <div class="status" aria-hidden="true">
        <span>9:41</span>
        <img class="signal" src="assets/medsi/smartmed-diagnostics/signal.svg" alt="">
        <img class="wifi" src="assets/medsi/smartmed-diagnostics/wifi.svg" alt="">
        <img class="battery" src="assets/medsi/smartmed-diagnostics/battery.svg" alt="">
      </div>
      <a class="back" href="medsi-diagnostics-entry.html" aria-label="Back"><img src="assets/medsi/smartmed-diagnostics/navbar.svg" alt=""></a>
      <div class="navigation-title"><h1>Choose a diagnostic test</h1><span>Maria Nazarova • Step 1 of 3</span></div>
    </header>
    <section class="specialty-main">
      <label class="search specialty-search">
        <img src="assets/medsi/smartmed-diagnostics/search.svg" alt="">
        <input type="search" aria-label="Search diagnostic tests" placeholder="Search">
      </label>
      <ul class="specialty-list" aria-label="Diagnostic tests">
        <li><button type="button" disabled>Lab tests (laboratory diagnostics)</button></li>
        <li><button type="button" disabled>Angiography and coronary angiography</button></li>
        <li><button type="button" disabled>Biopsy and needle aspiration</button></li>
        <li><a href="medsi-diagnostics-gastroscopy.html">Gastroscopy (EGD)</a></li>
        <li><button type="button" disabled>Hysteroscopy and colposcopy</button></li>
        <li><button type="button" disabled>Bone densitometry</button></li>
        <li><button type="button" disabled>Dermoscopy (mole mapping)</button></li>
        <li><button type="button" disabled>Duplex and triplex vascular ultrasound</button></li>
        <li><button type="button" disabled>Colonoscopy</button></li>
        <li><button type="button" disabled>Computed tomography (CT, MSCT)</button></li>
        <li><button type="button" disabled>Magnetic resonance imaging (MRI)</button></li>
        <li><button type="button" disabled>Mammography</button></li>
        <li><button type="button" disabled>Polysomnography (sleep studies)</button></li>
        <li><button type="button" disabled>Radiography (X-ray)</button></li>
        <li><button type="button" disabled>Spirometry (pulmonary function testing)</button></li>
        <li><button type="button" disabled>Ambulatory monitoring (Holter ECG, ABPM)</button></li>
        <li><button type="button" disabled>Ultrasound and echocardiography</button></li>
        <li><button type="button" disabled>Fluorography</button></li>
        <li><button type="button" disabled>Functional diagnostics</button></li>
        <li><button type="button" disabled>Health checkups and comprehensive programs</button></li>
        <li><button type="button" disabled>Electrocardiography (ECG)</button></li>
        <li><button type="button" disabled>Electroneuromyography (ENMG)</button></li>
        <li><button type="button" disabled>Electroencephalography (EEG)</button></li>
        <li><button type="button" disabled>Endoscopy (bronchoscopy, cystoscopy, etc.)</button></li>
      </ul>
      <p class="specialty-empty" role="status" hidden>No diagnostic tests found</p>
    </section>
    <div class="entry-home" aria-hidden="true"></div>
  </main>
</body>
</html>
